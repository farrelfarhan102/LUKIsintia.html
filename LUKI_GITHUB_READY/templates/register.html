</div><div class="authbox"><div class="brand">💙 LUKI</div><h1>Buat Akun</h1><p>Daftar sebagai pengguna baru.</p>{% with m=get_flashed_messages(with_categories=true) %}{% for c,x in m %}<div class="alert {{c}}">{{x}}</div>{% endfor %}{% endwith %}<form method="post"><label>Username</label><input name="username" minlength="3" required><label>Email</label><input name="email" type="email" required><label>Password</label><input name="password" type="password" minlength="5" required><label>Konfirmasi Password</label><input name="confirm" type="password" required><button>Daftar</button></form><div class="line">Sudah punya akun? <a href="{{url_for('login')}}">Login</a></div></div><script src="{{url_for('static',filename='script.js')}}"></script></body></html>
